<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forebet Dashboard Pro</title>
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2933/2933246.png">
    
    <!-- Librerie -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root { --transition: all 0.3s ease; }
        
        [data-theme="dark"] {
            --bg-primary: #0f172a; --bg-card: #1e293b; --text-main: #f8fafc;
            --text-muted: #94a3b8; --border: #334155; --header-bg: rgba(15,23,42,0.95);
            --col-red: #ef4444; --col-white: #e2e8f0; --col-green: #22c55e; --col-gold: #fbbf24;
        }
        [data-theme="light"] {
            --bg-primary: #f1f5f9; --bg-card: #ffffff; --text-main: #1e293b;
            --text-muted: #64748b; --border: #e2e8f0; --header-bg: rgba(255,255,255,0.95);
            --col-red: #dc2626; --col-white: #475569; --col-green: #16a34a; --col-gold: #d97706;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-primary); color: var(--text-main); min-height: 100vh; transition: var(--transition); }

        /* HEADER */
        header { background: var(--header-bg); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; padding: 1rem 2rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; transition: var(--transition); }
        .brand { font-weight: 800; font-size: 1.5rem; }
        .brand span { color: var(--col-gold); }
        .header-controls { display: flex; gap: 1rem; align-items: center; }
        .clock { font-family: 'Courier New', monospace; font-weight: 600; color: var(--col-gold); background: rgba(251,191,36,0.1); padding: 0.4rem 0.8rem; border-radius: 6px; border: 1px solid rgba(251,191,36,0.3); }
        .theme-toggle { background: none; border: 1px solid var(--border); color: var(--text-main); width: 40px; height: 40px; border-radius: 8px; cursor: pointer; font-size: 1.1rem; transition: var(--transition); }
        .theme-toggle:hover { background: var(--border); }

        /* CONTROLS */
        .controls-bar { padding: 1rem 2rem; display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; border-bottom: 1px solid var(--border); background: var(--bg-primary); transition: var(--transition); }
        .tabs { display: flex; gap: 0.5rem; }
        .tab-btn { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-weight: 600; transition: var(--transition); }
        .tab-btn.active { background: var(--col-gold); color: #000; border-color: var(--col-gold); }
        .tab-btn:hover:not(.active) { border-color: var(--text-main); color: var(--text-main); }
        
        .view-switch {
            display: flex;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }
        .view-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
            font-size: 0.85rem;
        }
        .view-btn.active {
            background: var(--col-gold);
            color: #000;
        }
        .view-btn:hover:not(.active) {
            color: var(--text-main);
        }
        
        select.sort-select { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border); padding: 0.5rem 1rem; border-radius: 6px; transition: var(--transition); cursor: pointer; outline: none; }
        select.sort-select:focus { border-color: var(--col-gold); }
        .info-badge { font-size: 0.8rem; color: var(--text-muted); background: rgba(128,128,128,0.1); padding: 0.3rem 0.8rem; border-radius: 20px; margin-left: auto; }

        /* LOADING */
        .loading-state { text-align: center; padding: 4rem; color: var(--text-muted); }
        .loading-state i { font-size: 2rem; margin-bottom: 1rem; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* GRID */
        #dashboard { padding: 2rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.5rem; max-width: 1800px; margin: 0 auto; width: 100%; }

        /* CARD */
        .match-card { background: var(--bg-card); border-radius: 12px; padding: 1.25rem; border: 1px solid var(--border); transition: var(--transition); display: flex; flex-direction: column; gap: 0.75rem; }
        .match-card:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .match-card.bomb-card { border-color: var(--col-gold); box-shadow: 0 0 15px rgba(251,191,36,0.15); }
        .card-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
        .league-name { font-weight: 600; color: var(--col-gold); }
        .teams-row { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 1rem; }
        .team { flex: 1; }
        .team.away { text-align: right; }
        .vs-badge { font-size: 0.7rem; color: var(--text-muted); padding: 0 0.5rem; }
        .prediction-core { display: flex; justify-content: center; align-items: center; gap: 1rem; margin: 0.5rem 0; }
        .pred-badge { font-size: 1.2rem; font-weight: 800; min-width: 60px; height: 50px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: rgba(128,128,128,0.1); padding: 0 10px; }
        .score-exact { font-size: 1.1rem; font-weight: 600; text-align: center; }
        .prob-container { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; margin-top: 0.5rem; }
        .prob-box { text-align: center; padding: 0.4rem 0; border-radius: 6px; font-size: 0.8rem; font-weight: 700; position: relative; }
        .prob-label { font-size: 0.6rem; opacity: 0.8; display: block; margin-bottom: 2px; }
        .stats-footer { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px solid var(--border); }

        /* COLORI */
        .c-red { color: var(--col-red); }
        .bg-red { background: rgba(239,68,68,0.15); color: var(--col-red); border: 1px solid rgba(239,68,68,0.3); }
        .c-white { color: var(--col-white); }
        .bg-white { background: rgba(128,128,128,0.1); color: var(--col-white); border: 1px solid var(--border); }
        .c-green { color: var(--col-green); }
        .bg-green { background: rgba(34,197,94,0.15); color: var(--col-green); border: 1px solid rgba(34,197,94,0.3); }
        .c-gold { color: var(--col-gold); text-shadow: 0 0 10px rgba(251,191,36,0.5); }
        .bg-gold { background: rgba(251,191,36,0.2); color: var(--col-gold); border: 1px solid var(--col-gold); box-shadow: 0 0 15px rgba(251,191,36,0.3); animation: pulse-gold 2s infinite; }
        @keyframes pulse-gold { 0% { box-shadow: 0 0 0 0 rgba(251,191,36,0.4); } 70% { box-shadow: 0 0 0 8px rgba(251,191,36,0); } 100% { box-shadow: 0 0 0 0 rgba(251,191,36,0); } }

        .empty-state { grid-column: 1/-1; text-align: center; padding: 4rem; color: var(--text-muted); font-size: 1.2rem; }
        .date-separator { grid-column: 1/-1; padding: 0.5rem 0; margin-top: 0.5rem; }
        .date-separator-inner { display: flex; align-items: center; gap: 0.8rem; color: var(--col-gold); font-weight: 700; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
        .date-separator-line { flex: 1; height: 1px; background: rgba(251,191,36,0.3); }

        @media (max-width: 768px) {
            header { padding: 1rem; flex-direction: column; gap: 0.5rem; }
            .controls-bar { padding: 1rem; flex-direction: column; align-items: stretch; }
            .info-badge { margin-left: 0; text-align: center; }
            #dashboard { padding: 1rem; grid-template-columns: 1fr; }
            .view-switch { width: 100%; }
            .view-btn { flex: 1; text-align: center; }
        }
    </style>
</head>
<body>
    <header>
        <div class="brand"><i class="fa-solid fa-chart-line"></i> Forebet<span>Dashboard</span></div>
        <div class="header-controls">
            <div class="clock" id="live-clock">--:--:--</div>
            <button class="theme-toggle" id="theme-toggle" title="Cambia Tema"><i class="fa-solid fa-moon"></i></button>
        </div>
    </header>

    <div class="controls-bar">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('all')">Tutte le Partite</button>
            <button class="tab-btn" onclick="switchTab('bomb')">💣 BOMBA</button>
        </div>
        
        <div class="view-switch" id="view-switch">
            <button class="view-btn active" data-view="date" onclick="setView('date')">
                <i class="fa-regular fa-calendar"></i> Data
            </button>
            <button class="view-btn" data-view="league" onclick="setView('league')">
                <i class="fa-regular fa-futbol"></i> Campionato
            </button>
        </div>
        
        <div class="info-badge"><i class="fa-regular fa-calendar"></i> Oggi → +6 giorni</div>
    </div>

    <div id="dashboard">
        <div class="loading-state"><i class="fa-solid fa-spinner"></i><br>Caricamento dati da GitHub...</div>
    </div>

    <script>
        // === CONFIG ===
        const GITHUB_XLSX_URL = 'https://raw.githubusercontent.com/Gesss26/Gesss-Forebet/main/Data/Forebet_Europa_Completo.xlsx';
        const STORAGE_KEY = 'forebet_dashboard_data';
        const THEME_KEY = 'forebet_theme';

        let allMatches = [];
        let currentTab = 'all';
        let currentView = 'date';

        // === CLOCK ===
        function updateClock() {
            const now = new Date();
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('live-clock').textContent = `${day}/${month}/${year} ${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // === THEME ===
        function initTheme() {
            const saved = localStorage.getItem(THEME_KEY) || 'dark';
            document.documentElement.setAttribute('data-theme', saved);
            updateThemeIcon(saved);
        }
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem(THEME_KEY, next);
            updateThemeIcon(next);
        }
        function updateThemeIcon(theme) {
            document.querySelector('#theme-toggle i').className = theme === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        }
        document.getElementById('theme-toggle').addEventListener('click', toggleTheme);

        // === VIEW SWITCH ===
        function setView(view) {
            currentView = view;
            document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.view-btn[data-view="${view}"]`).classList.add('active');
            renderDashboard();
        }

        // === DATA LOADING ===
        async function loadData() {
            const dashboard = document.getElementById('dashboard');
            
            try {
                const cached = localStorage.getItem(STORAGE_KEY);
                if (cached) {
                    const parsed = JSON.parse(cached);
                    allMatches = parsed.matches || [];
                    renderDashboard();
                    fetchFromGitHub(true);
                    return;
                }
            } catch(e) {}

            await fetchFromGitHub(false);
        }

        async function fetchFromGitHub(silent) {
            const dashboard = document.getElementById('dashboard');
            if (!silent) {
                dashboard.innerHTML = '<div class="loading-state"><i class="fa-solid fa-spinner"></i><br>Caricamento dati da GitHub...</div>';
            }
            try {
                const resp = await fetch(GITHUB_XLSX_URL, { cache: 'no-cache' });
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const buf = await resp.arrayBuffer();
                const wb = XLSX.read(new Uint8Array(buf), { type: 'array' });
                const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
                
                allMatches = json.map(enrichMatch);
                
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify({ matches: allMatches, timestamp: new Date().toISOString() }));
                } catch(e) { console.warn('Storage full'); }
                
                renderDashboard();
            } catch(err) {
                if (!silent) {
                    dashboard.innerHTML = `<div class="empty-state"><i class="fa-solid fa-triangle-exclamation" style="font-size:2rem;margin-bottom:1rem;"></i><br>Errore caricamento: ${err.message}<br><small>Verifica che il file esista su GitHub</small></div>`;
                }
            }
        }

        // === MATCH ENRICHMENT ===
        function enrichMatch(m) {
            const p1 = parseFloat(m['Prob_1%']) || 0;
            const px = parseFloat(m['Prob_X%']) || 0;
            const p2 = parseFloat(m['Prob_2%']) || 0;
            
            const probs = [{l:'1',v:p1},{l:'X',v:px},{l:'2',v:p2}].sort((a,b) => b.v - a.v);
            const dcLabel = probs.slice(0,2).map(p => p.l).sort().join('');
            const dcSum = probs[0].v + probs[1].v;
            const maxVal = probs[0].v;
            const othersSum = probs[1].v + probs[2].v;
            
            const isGold = maxVal > (othersSum + 10);
            const isBomb = isGold && dcSum > 85;
            
            const parsedDate = parseDate(m['Data']);
            
            return { ...m, _p1:p1, _px:px, _p2:p2, _dcLabel:dcLabel, _dcSum:dcSum, _isGold:isGold, _isBomb:isBomb, _maxVal:maxVal, _parsedDate:parsedDate };
        }

        function parseDate(dateStr) {
            if (!dateStr) return null;
            const parts = dateStr.trim().split(' ');
            const dmy = parts[0].split('/');
            if (dmy.length !== 3) return null;
            let h = 0, min = 0;
            if (parts[1]) { const hm = parts[1].split(':'); h = parseInt(hm[0])||0; min = parseInt(hm[1])||0; }
            return new Date(parseInt(dmy[2]), parseInt(dmy[1])-1, parseInt(dmy[0]), h, min);
        }

        // === FILTERING & SORTING ===
        function getDateWindow() {
            const today = new Date(); today.setHours(0,0,0,0);
            const max = new Date(today); max.setDate(max.getDate()+6); max.setHours(23,59,59,999);
            return { min: today, max: max };
        }

        function getFilteredSorted() {
            const { min, max } = getDateWindow();
            let filtered = allMatches.filter(m => m._parsedDate && m._parsedDate >= min && m._parsedDate <= max);
            if (currentTab === 'bomb') filtered = filtered.filter(m => m._isBomb);
            
            filtered.sort((a, b) => {
                // La DATA comanda SEMPRE come primo filtro in entrambe le viste
                const dateDiff = a._parsedDate.getTime() - b._parsedDate.getTime();
                if (dateDiff !== 0) return dateDiff;
                
                // SECONDO FILTRO: dipende dalla vista selezionata
                if (currentView === 'league') {
                    // Vista Campionato: dopo la data, ordina A-Z per campionato
                    return (a['Campionato'] || '').localeCompare(b['Campionato'] || '', 'it', { sensitivity: 'base' });
                } else {
                    // Vista Data: nessun secondo filtro alfabetico, mantieni ordine orario puro
                    // (I campionati saranno naturalmente misti a parità di data/ora)
                    return 0; 
                }
            });
            
            return filtered;
        }

        // === RENDERING ===
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            renderDashboard();
        }

        function getProbClasses(p1, px, p2, maxVal, isGold) {
            const vals = [p1,px,p2]; const sorted = [...vals].sort((a,b)=>a-b);
            const min = sorted[0], mid = sorted[1];
            const get = v => {
                if (v === maxVal && isGold) return 'c-gold bg-gold';
                if (v === maxVal) return 'c-green bg-green';
                if (v === min) return 'c-red bg-red';
                return 'c-white bg-white';
            };
            return { c1:get(p1), cX:get(px), c2:get(p2) };
        }

        function formatDateLabel(d) {
            const today = new Date(); today.setHours(0,0,0,0);
            const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate()+1);
            const md = new Date(d); md.setHours(0,0,0,0);
            if (md.getTime() === today.getTime()) return "OGGI";
            if (md.getTime() === tomorrow.getTime()) return "DOMANI";
            const days = ['DOM','LUN','MAR','MER','GIO','VEN','SAB'];
            return days[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth()+1);
        }

        function renderDashboard() {
            const dashboard = document.getElementById('dashboard');
            dashboard.innerHTML = '';
            const matches = getFilteredSorted();

            if (!matches.length) {
                const msg = currentTab === 'bomb' 
                    ? 'Nessuna partita BOMBA trovata nei prossimi 7 giorni.<br><small>Richiede: % Oro + DC > 85%</small>'
                    : 'Nessuna partita trovata nella finestra Oggi → +6 giorni.';
                dashboard.innerHTML = `<div class="empty-state"><i class="fa-solid fa-ghost" style="font-size:3rem;margin-bottom:1rem;opacity:0.5;"></i><br>${msg}</div>`;
                return;
            }

            let lastDateLabel = '';
            let lastLeagueName = '';
            
            matches.forEach(m => {
                // Separatori per data (solo in vista "date")
                if (currentView === 'date' && m._parsedDate) {
                    const dl = formatDateLabel(m._parsedDate);
                    if (dl !== lastDateLabel) {
                        lastDateLabel = dl;
                        dashboard.insertAdjacentHTML('beforeend', `<div class="date-separator"><div class="date-separator-inner"><i class="fa-regular fa-calendar-day"></i>${dl}<div class="date-separator-line"></div></div></div>`);
                    }
                }
                
                // Separatori per campionato (solo in vista "league")
                if (currentView === 'league') {
                    const league = m['Campionato'] || 'Altro';
                    if (league !== lastLeagueName) {
                        lastLeagueName = league;
                        dashboard.insertAdjacentHTML('beforeend', `<div class="date-separator"><div class="date-separator-inner"><i class="fa-solid fa-trophy"></i>${league}<div class="date-separator-line"></div></div></div>`);
                    }
                }

                const cls = getProbClasses(m._p1, m._px, m._p2, m._maxVal, m._isGold);
                const predCls = m._isGold ? 'c-gold bg-gold' : 'c-green bg-green';
                const bombBadge = m._isBomb ? '<i class="fa-solid fa-bomb" style="margin-left:6px;animation:pulse-gold 1s infinite;"></i>' : '';
                const cardCls = m._isBomb ? 'match-card bomb-card' : 'match-card';
                const timeStr = m._parsedDate ? m._parsedDate.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}) : '';

                dashboard.insertAdjacentHTML('beforeend', `
                    <div class="${cardCls}">
                        <div class="card-header">
                            <span class="league-name"><i class="fa-solid fa-trophy"></i> ${m['Campionato']||'N/A'}</span>
                            <span><i class="fa-regular fa-clock"></i> ${timeStr}</span>
                        </div>
                        <div class="teams-row">
                            <div class="team">${m['Casa']||'Casa'}</div>
                            <div class="vs-badge">VS</div>
                            <div class="team away">${m['Trasferta']||'Ospite'}</div>
                        </div>
                        <div class="prediction-core">
                            <div class="pred-badge ${predCls}">${m._dcLabel}${bombBadge}</div>
                            <div class="score-exact">
                                <span style="font-size:0.7rem;color:var(--text-muted);display:block;">Ris. Esatto</span>
                                ${m['Risultato_Esatto']||'-'}
                            </div>
                        </div>
                        <div class="prob-container">
                            <div class="prob-box ${cls.c1}"><span class="prob-label">1</span>${m._p1}%</div>
                            <div class="prob-box ${cls.cX}"><span class="prob-label">X</span>${m._px}%</div>
                            <div class="prob-box ${cls.c2}"><span class="prob-label">2</span>${m._p2}%</div>
                        </div>
                        <div class="stats-footer">
                            <span><i class="fa-solid fa-shield-halved"></i> DC: ${m._dcLabel} (${Math.round(m._dcSum)}%)</span>
                            <span><i class="fa-solid fa-futbol"></i> Gol: ${m['Media_Gol']||'-'}</span>
                        </div>
                    </div>
                `);
            });
        }

        // === PWA SERVICE WORKER ===
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(()=>{});
        }

        // === INIT ===
        initTheme();
        loadData();
    </script>
</body>
</html>
